name: wayformer
d_model: 256
d_ffn: 1024
nhead: 8
dropout: 0.1
# 0 = decoder attends packed / factorized scene tokens (no Perceiver latents).
num_latents: 0
encoder_layers: 2
hist_in_dim: 18
map_in_dim: 26
tl_in_dim: 11
ego_in_dim: 12
route_in_dim: 3
# Mission via on-route lane bit in map features — no preferred-path XY tokens.
use_route_tokens: false
drop_ego_hist: false
# Ego token: mlp | sde (PlanTF StateAttentionEncoder).
ego_encoder: sde
# Channel drop on speed/ax/ay inside SDE (pose channels always kept).
ego_sde_dropout: 0.5
ego_sde_channels: 6
# Ego in agent social pool (factorized), fuse with map, then split.
ego_in_social: true
# Separate agent / map banks. Pair with decoder.triple_cross (or dual_cross).
factorized: true
agent_pool: lstm  # lstm | mean | last
agent_lstm_layers: 2
