# @package _global_
defaults:
  - /data: womd
  - /model: wayformer
  - /decoder: hydra
  - _self_

ckpt: checkpoints/hydra_4s/best.pt
split: val
batch_size: 8
max_scenarios: 256
horizons: [10, 20, 30, 40, 50, 60, 70, 80]
iou_buffers: [0.5, 1.0, 2.0]
device: cuda
target_mode: sdc
out: ${parent:${ckpt}}/open_loop.json

hydra:
  job:
    chdir: false
  run:
    dir: ${parent:${ckpt}}
