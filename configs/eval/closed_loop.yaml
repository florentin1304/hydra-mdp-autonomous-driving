# @package _global_
defaults:
  - /data: womd
  - /model: wayformer
  - /decoder: hydra
  - _self_

ckpt: checkpoints/hydra_4s/best.pt
split: val
neighbors: log
max_scenarios: 64
horizon: 80
device: cuda
viz_dir: ${parent:${ckpt}}/viz_${neighbors}_${mode_select}
viz_every: 8
out: ${parent:${ckpt}}/closed_loop_${neighbors}_${mode_select}.json
h_exec: 1
# argmax of infer() scores. Those already apply decoder.weights, including epo.
mode_select: hydra_mdp_w

hydra:
  job:
    chdir: false
  run:
    dir: ${parent:${ckpt}}
