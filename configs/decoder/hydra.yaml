name: hydra
vocab_path: data/artifacts/hydra_vocab_4s.npy
vocab_size: 4096
decoder_layers: 2
query_chunk: 256
# Konev / Hydra flatten-xy L2: q ∝ exp(-||flatten(xy_v)-flatten(xy_a)||_2).
distance: flatten_l2
temperature: 1.0
soft_k: null
imi_times: null
# Policy objective: imitation | epo | mix | pdms
#   imitation — soft-CE toward near-human vocab modes (im_head)
#   epo       — Exhaustive Policy Optimization on PDMS (epo_head only)
#   mix       — train both heads; pick which to select with policy_head
#   pdms      — legacy soft-CE + BCE toward PDMS on im_head
main: mix
# Which head feeds hydra_mdp_w when only one policy weight is >0: imitation | epo
# When both weights.imitation and weights.epo are >0, selection blends both.
policy_head: epo
# Policy loss scales (independent of hydra_mdp_w ``weights`` below).
# EPO regret is normalized to ~[0,1], same ballpark as imitation KL / metric BCE.
imitation_loss_scale: 1.0
epo_loss_scale: 1.0
# Collapse-only entropy: penalty = coef * relu(ln(min_k) - H)^2; 0 if H >= ln(min_k).
# τ=1: no temperature softening of π.
epo_entropy: 0.05
epo_temperature: 1.0
epo_entropy_min_k: 256
metric_heads: true
metric_cache: data/artifacts/hydra_metrics_4s
windows_path: data/artifacts/hydra_vocab_4s_windows.npz
front_weight: 1.0
collision_weight: 0.0
pdms_scale: 0.0
# At most 12 train windows per vocab class (~48k, same epoch length as 48805/32).
subsample_cap: 12
# Optional ADE/PDMS winner cache for class subsample when windows_path is unset.
winner_cache: null
metric_stopgrad: true
# Multiply metric BCE before adding to policy loss (use <1 when unfreezing trunk).
metric_loss_scale: 1.0
# Balanced BCE: w1=1/(2p), w0=1/(2(1-p)) so rare class (usually failures) counts.
metric_class_weighted: true
# EMA momentum for per-stage P(y=1). Separate EMA per LDiP stage K (4096/256/16).
# 0 = use batch rates only (no EMA).
metric_rate_ema: 0.99
# Optional clamp on each of w0/w1 (e.g. 10) when metric_stopgrad=false.
metric_pos_weight_cap: null
# Per-metric MLP (fused GEMM / bmm over M — heads run together, not a loop).
metric_head_layers: 3
metric_head_hidden: 256
# One-stage: empty prune_to scores the full vocab once (no LDiP cascade).
# For LDiP: prune_to: [256, 16] with gumbel_tau: 1.0
prune_to: []
gumbel_tau: 1.0
nms_radius: 0.0
keep_winner: false
hard_last: false
# Flattened xy only (40*2) + learned mode ID.
tokenizer: mlp
xy_scale: 10.0
# Paper Eq. 6: self-attn over vocab once, then ego + cross-only scene decoder.
vocab_self_attn_layers: 0
cross_only: true
# Traj queries → agents then map. Needs model.factorized=true.
dual_cross: false
# Traj queries → map → ego → neighbours. Needs factorized + ego_tokens
# (model.ego_in_social=true recommended). Overrides dual order when true.
triple_cross: true
# Parallel map/ego/agent cross + concat-MLP fuse per layer (vs sequential).
# Requires triple_cross. Fuse last Linear is zero-init (residual identity at start).
triple_parallel: false
# Per-mode query fusion: Q = traj + MLP(concat(traj, ego)) with traj skip.
# Set false for traj-only queries (ego only via KV / triple_cross).
ego_on_query: true
h_exec: 40
cl_select: hydra_mdp_w
weights:
  # hydra_mdp_w *selection* only (not train loss scales — see *_loss_scale above).
  # Keep policy term small so NC/DAC/rule dominate, same as old imitation: 0.1.
  imitation: 0.1
  epo: 0.1
  pdms: 0.0
  nc: 1.0
  dac: 1.0
  ddc: 0.0
  tlc: 0.0
  ttc: 5.0
  lk: 0.0
  hc: 2.0
  progress: 5.0
  rule: 1.0
