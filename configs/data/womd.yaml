root: data/womd
raw_dir: ${data.root}/raw
packed_dir: ${data.root}/packed
train_file: ${data.packed_dir}/train.h5
val_file: ${data.packed_dir}/val.h5
# Packed train is ~100/1000 WOMD shards (~10%). null = use the whole pack.
max_train_scenarios: null
max_val_scenarios: null
num_agents: 64
num_map_polylines: 512
polyline_points: 20
num_traffic_lights: 32
num_route_paths: 16
route_points: 128
history_steps: 11
future_steps: 80
current_step: 10
dt: 0.1
target_mode: sdc
num_workers: 16
# Pose jitter (train only): rebuild agent-centric tensors, supervise log future.
# Default off. Gaussian via xy_std/yaw_std, or PlanTF uniform via
# dist=uniform + lon/lat/yaw_{low,high} (see apply_origin_perturb).
perturb:
  prob: 0.0
  xy_std: 0.2
  yaw_std: 0.2
